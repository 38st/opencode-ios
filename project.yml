name: Opencode
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  projectFormat: xcode16_3
  deploymentTarget:
    iOS: "26.4"
packages:
  OpencodeKit:
    path: Packages/OpencodeKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.18.7
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    # One version for the app and its extensions; App Store validation requires them to match.
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    OTHER_LDFLAGS: ["$(inherited)", "-framework", "AppIntents"]
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
targets:
  Opencode:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).client
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
    info:
      path: App/Info.plist
      properties:
        OCAppGroup: $(APP_GROUP_ID)
        OCKeychainGroup: $(SHARED_KEYCHAIN_GROUP)
        OCAPNSEnvironment: $(APNS_ENVIRONMENT)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).routes
            CFBundleURLSchemes: [opencodeios]
        CFBundleDisplayName: Opencode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # A Home row dragged to the edge of the screen opens its session in a new window; a session found in
        # Spotlight opens through its item.
        NSUserActivityTypes:
          - $(PRODUCT_BUNDLE_IDENTIFIER).session
          - com.apple.corespotlightitem
        # The in-app type a Files row carries when it is dragged onto the composer.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.opencodeios.file-mention
            UTTypeDescription: File mention
            UTTypeConformsTo: [public.data]
        NSCameraUsageDescription: Opencode uses the camera to scan server pairing QR codes and attach photos to prompts.
        NSFaceIDUsageDescription: Opencode verifies it is you before always allowing an action or approving a high-risk request.
        NSLocalNetworkUsageDescription: Opencode uses your local network to connect to opencode servers you choose on your computers.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: NotificationService
        embed: true
      - target: Widgets
        embed: true
      - package: OpencodeKit
        product: FeatureServers
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCSync
      - package: OpencodeKit
        product: OCIntents
      - package: OpencodeKit
        product: OCAppIntents
  NotificationService:
    type: app-extension
    platform: iOS
    sources: [Extensions/NotificationService]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).client.notification-service
        CODE_SIGN_ENTITLEMENTS: Config/Extension.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Extensions/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Opencode Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OCAppGroup: $(APP_GROUP_ID)
        OCKeychainGroup: $(SHARED_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    dependencies:
      - package: OpencodeKit
        product: OCPushCore
      - package: OpencodeKit
        product: OCSecurity
      - package: OpencodeKit
        product: OCShared
  Widgets:
    type: app-extension
    platform: iOS
    # OC-2 colours and Inter come from OCDesign's resources; no OCDesign code is linked.
    sources:
      - Extensions/Widgets
      - path: Packages/OpencodeKit/Sources/OCDesign/Resources/Colors.xcassets
      - path: Packages/OpencodeKit/Sources/OCDesign/Resources/Fonts/Inter.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).client.widgets
        CODE_SIGN_ENTITLEMENTS: Config/Extension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Opencode Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OCAppGroup: $(APP_GROUP_ID)
        OCKeychainGroup: $(SHARED_KEYCHAIN_GROUP)
        UIAppFonts: [Inter.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: OpencodeKit
        product: OCActivity
      - package: OpencodeKit
        product: OCShared
      - package: OpencodeKit
        product: OCIntents
  OpencodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Opencode
  ServerSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/OpencodeKit/Tests/FeatureServersTests
        excludes: [__Snapshots__]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).snapshots
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: OpencodeKit
        product: OCFoundation
      - package: OpencodeKit
        product: FeatureServers
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCDesign
      - package: OpencodeKit
        product: OCSync
      - package: OpencodeKit
        product: OCNetworking
      - package: OpencodeKit
        product: OCSecurity
      - package: SnapshotTesting
        product: SnapshotTesting
  ReadSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/OpencodeKit/Tests/ReadSnapshots
        excludes: [__Snapshots__]
      - path: Packages/OpencodeKit/Tests/OCSyncTests/ReadPerformanceTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).read-snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ComposerSnapshotHost.app/ComposerSnapshotHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: ComposerSnapshotHost
      - package: OpencodeKit
        product: OCFoundation
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCDesign
      - package: OpencodeKit
        product: OCSync
      - package: OpencodeKit
        product: OCRender
      - package: OpencodeKit
        product: FeatureTranscript
      - package: OpencodeKit
        product: FeatureInbox
      - package: OpencodeKit
        product: OCNetworking
      - package: OpencodeKit
        product: OCSecurity
      - package: SnapshotTesting
        product: SnapshotTesting

  ApprovalSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/OpencodeKit/Tests/ApprovalSnapshots
        excludes: [__Snapshots__]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).approval-snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ComposerSnapshotHost.app/ComposerSnapshotHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: ComposerSnapshotHost
      - package: OpencodeKit
        product: OCFoundation
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCDesign
      - package: OpencodeKit
        product: FeatureApprovals
      - package: OpencodeKit
        product: OCSecurity
      - package: SnapshotTesting
        product: SnapshotTesting


  ReviewSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/OpencodeKit/Tests/ReviewSnapshots
        excludes: [__Snapshots__]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).review-snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ComposerSnapshotHost.app/ComposerSnapshotHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: ComposerSnapshotHost
      - package: OpencodeKit
        product: OCFoundation
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCDesign
      - package: OpencodeKit
        product: OCRender
      - package: OpencodeKit
        product: OCNetworking
      - package: OpencodeKit
        product: OCPersistence
      - package: OpencodeKit
        product: OCSync
      - package: OpencodeKit
        product: FeatureReview
      - package: OpencodeKit
        product: FeatureFiles
      - package: OpencodeKit
        product: FeatureComposer
      - package: OpencodeKit
        product: FeatureTranscript
      - package: SnapshotTesting
        product: SnapshotTesting

  PushSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/OpencodeKit/Tests/PushSnapshots
        excludes: [__Snapshots__]
      - path: Extensions/Widgets/SessionActivityView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).push-snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ComposerSnapshotHost.app/ComposerSnapshotHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: ComposerSnapshotHost
      - package: OpencodeKit
        product: FeatureSettings
      - package: OpencodeKit
        product: OCActivity
      - package: OpencodeKit
        product: OCIntents
      - package: OpencodeKit
        product: OCShared
      - package: OpencodeKit
        product: OCSync
      - package: OpencodeKit
        product: OCNetworking
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCFoundation
      - package: OpencodeKit
        product: OCSecurity
      - package: OpencodeKit
        product: OCDesign
      - package: SnapshotTesting
        product: SnapshotTesting
  SystemSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/OpencodeKit/Tests/SystemSnapshots
        excludes: [__Snapshots__]
      - path: Extensions/Widgets/SessionWidgetViews.swift
      - path: Extensions/Widgets/WidgetTheme.swift
      - path: Extensions/Widgets/WidgetIcons.xcassets
      - path: Packages/OpencodeKit/Sources/OCDesign/Resources/Colors.xcassets
      - path: Packages/OpencodeKit/Sources/OCDesign/Resources/Fonts/Inter.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).system-snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ComposerSnapshotHost.app/ComposerSnapshotHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: ComposerSnapshotHost
      - package: OpencodeKit
        product: OCShared
      - package: OpencodeKit
        product: OCIntents
      - package: OpencodeKit
        product: OCSync
      - package: OpencodeKit
        product: OCNetworking
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCFoundation
      - package: OpencodeKit
        product: OCDesign
      - package: OpencodeKit
        product: FeatureSettings
      - package: SnapshotTesting
        product: SnapshotTesting
  TerminalSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/OpencodeKit/Tests/TerminalSnapshots
        excludes: [__Snapshots__]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).terminal-snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ComposerSnapshotHost.app/ComposerSnapshotHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: ComposerSnapshotHost
      - package: OpencodeKit
        product: OCFoundation
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCDesign
      - package: OpencodeKit
        product: OCNetworking
      - package: OpencodeKit
        product: OCPersistence
      - package: OpencodeKit
        product: OCSync
      - package: OpencodeKit
        product: FeatureTerminal
      - package: SnapshotTesting
        product: SnapshotTesting
  ComposerEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ComposerEditorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).composer-editor-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ComposerSnapshotHost.app/ComposerSnapshotHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: ComposerSnapshotHost
      - package: OpencodeKit
        product: FeatureComposer
      - package: OpencodeKit
        product: OCModels

  ComposerSnapshotHost:
    type: application
    platform: iOS
    sources: [Tests/ComposerSnapshotHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).composer-snapshot-host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  ComposerSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/OpencodeKit/Tests/ComposerSnapshots
        excludes: [__Snapshots__]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).composer-snapshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ComposerSnapshotHost.app/ComposerSnapshotHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: ComposerSnapshotHost
      - package: OpencodeKit
        product: OCFoundation
      - package: OpencodeKit
        product: OCModels
      - package: OpencodeKit
        product: OCDesign
      - package: OpencodeKit
        product: OCSync
      - package: OpencodeKit
        product: OCPersistence
      - package: OpencodeKit
        product: OCNetworking
      - package: OpencodeKit
        product: OCSecurity
      - package: OpencodeKit
        product: FeatureComposer
      - package: OpencodeKit
        product: FeatureTranscript
      - package: OpencodeKit
        product: OCRender
      - package: SnapshotTesting
        product: SnapshotTesting

schemes:
  Opencode:
    build:
      targets:
        Opencode: all
    run:
      config: Debug
    test:
      targets:
        - OpencodeUITests
        - ServerSnapshots
        - ReadSnapshots
        - ApprovalSnapshots
        - ComposerSnapshots
        - ComposerEditorTests
        - ReviewSnapshots
        - PushSnapshots
        - TerminalSnapshots
        - SystemSnapshots
      gatherCoverageData: false
  ComposerEditor:
    build:
      targets:
        Opencode: all
    test:
      targets:
        - ComposerEditorTests
      gatherCoverageData: false
